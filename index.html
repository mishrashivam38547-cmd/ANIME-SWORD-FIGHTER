<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Fighting Game - 300 Levels</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
            user-select: none;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: space-between;
            width: 95%;
            color: white;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
        }
        .health-container {
            width: 30%;
            background: #444;
            border: 2px solid #fff;
            height: 20px;
            border-radius: 4px;
            overflow: hidden;
        }
        .health-bar {
            height: 100%;
            width: 100%;
            background: #e74c3c;
            transition: width 0.2s ease;
        }
        #p2-health { background: #3498db; }
        #level-info {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            color: #f1c40f;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
        }
        #controls {
            position: absolute;
            bottom: 15px;
            width: 100%;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 10;
            padding: 0 10px;
        }
        button {
            padding: 12px 18px;
            font-size: 14px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        button:active { background: rgba(255, 255, 255, 0.5); }
    </style>
</head>
<body>

    <div id="ui">
        <div>P1: <span id="p1-name">Warrior</span></div>
        <div class="health-container"><div id="p1-health" class="health-bar"></div></div>
        <div class="health-container"><div id="p2-health" class="health-bar"></div></div>
        <div>AI: <span id="p2-name">Shadow</span></div>
    </div>
    
    <div id="level-info">Level: <span id="current-level">1</span> / 300</div>

    <div id="controls">
        <button onclick="movePlayer('left')">⬅️ Left</button>
        <button onclick="movePlayer('right')">Right ➡️</button>
        <button onclick="movePlayer('jump')">⬆️ Jump</button>
        <button onclick="playerAttack('punch')" style="background: rgba(231, 76, 60, 0.4);">Punch</button>
        <button onclick="playerAttack('kick')" style="background: rgba(52, 152, 219, 0.4);">Kick</button>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let player, opponent;
        let p1Health = 100, p2Health = 100;
        let p1VelocityY = 0;
        let isJumpingP1 = false;
        const gravity = 0.015;
        
        let currentLevel = 1;
        const maxLevel = 300;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);
            scene.fog = new THREE.Fog(0x0b0f19, 10, 50);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            // Floor
            const floorGeo = new THREE.PlaneGeometry(30, 15);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e272e, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Back Wall
            const wallGeo = new THREE.BoxGeometry(30, 10, 0.5);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x11161d });
            const backWall = new THREE.Mesh(wallGeo, wallMat);
            backWall.position.set(0, 5, -7.5);
            scene.add(backWall);

            // Fighters
            player = createDetailedFighter(0xe74c3c);
            player.position.set(-2, 0, 0);
            scene.add(player);

            opponent = createDetailedFighter(0x3498db);
            opponent.position.set(2, 0, 0);
            scene.add(opponent);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createDetailedFighter(colorHex) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: colorHex });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const limbMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.1, 0.4), mat);
            torso.position.y = 1.1;
            group.add(torso);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), skinMat);
            head.position.y = 1.85;
            group.add(head);

            // Left Arm
            const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.9, 0.2), limbMat);
            leftArm.position.set(-0.5, 1.1, 0);
            group.add(leftArm);
            group.userData.leftArm = leftArm;

            // Right Arm (Punching arm)
            const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.9, 0.2), limbMat);
            rightArm.position.set(0.5, 1.1, 0);
            group.add(rightArm);
            group.userData.rightArm = rightArm;

            // Left Leg
            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.0, 0.25), limbMat);
            leftLeg.position.set(-0.2, 0.5, 0);
            group.add(leftLeg);

            // Right Leg (Kicking leg)
            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.0, 0.25), limbMat);
            rightLeg.position.set(0.2, 0.5, 0);
            group.add(rightLeg);
            group.userData.rightLeg = rightLeg;

            return group;
        }

        function movePlayer(action) {
            if (action === 'left') player.position.x -= 0.5;
            if (action === 'right') player.position.x += 0.5;
            if (action === 'jump' && !isJumpingP1) {
                p1VelocityY = 0.3;
                isJumpingP1 = true;
            }
        }

        function playerAttack(type) {
            let damage = type === 'punch' ? 5 : 10;

            // Punch Animation (Right arm moves forward)
            if (type === 'punch') {
                player.userData.rightArm.position.z = 0.6;
                setTimeout(() => {
                    player.userData.rightArm.position.z = 0;
                }, 150);
            } 
            // Kick Animation (Right leg moves forward/up)
            else if (type === 'kick') {
                player.userData.rightLeg.position.z = 0.6;
                player.userData.rightLeg.rotation.x = -0.5;
                setTimeout(() => {
                    player.userData.rightLeg.position.z = 0;
                    player.userData.rightLeg.rotation.x = 0;
                }, 150);
            }

            let dist = Math.abs(player.position.x - opponent.position.x);
            if (dist < 2.0) {
                p2Health = Math.max(0, p2Health - damage);
                document.getElementById('p2-health').style.width = p2Health + '%';
                opponent.position.x += 0.4;
                setTimeout(() => opponent.position.x -= 0.4, 100);
                checkWin();
            }
        }

        function aiLogic() {
            let currentAiSpeed = 0.03 + Math.min(currentLevel * 0.0005, 0.04);
            let currentAiChance = 0.015 + Math.min(currentLevel * 0.0003, 0.03);

            if (Math.random() < 0.04) {
                let dir = player.position.x > opponent.position.x ? currentAiSpeed : -currentAiSpeed;
                opponent.position.x += dir;
            }
            let dist = Math.abs(player.position.x - opponent.position.x);
            if (dist < 1.8 && Math.random() < currentAiChance) {
                // AI Punch Animation
                opponent.userData.rightArm.position.z = -0.6;
                setTimeout(() => {
                    opponent.userData.rightArm.position.z = 0;
                }, 150);

                let aiDamage = 4 + Math.floor(currentLevel * 0.08);
                p1Health = Math.max(0, p1Health - aiDamage);
                document.getElementById('p1-health').style.width = p1Health + '%';
                player.position.x -= 0.4;
                setTimeout(() => player.position.x += 0.4, 100);
                checkWin();
            }
        }

        function checkWin() {
            if (p1Health <= 0) {
                alert("You Lost! Restarting Level " + currentLevel);
                resetMatch();
            } else if (p2Health <= 0) {
                if (currentLevel >= maxLevel) {
                    alert("Congratulations! You completed all 300 Levels and won the game!");
                    currentLevel = 1;
                } else {
                    alert("Level " + currentLevel + " Cleared! Moving to Level " + (currentLevel + 1));
                    currentLevel++;
                }
                document.getElementById('current-level').innerText = currentLevel;
                resetMatch();
            }
        }

        function resetMatch() {
            p1Health = 100;
            p2Health = 100;
            document.getElementById('p1-health').style.width = '100%';
            document.getElementById('p2-health').style.width = '100%';
            player.position.set(-2, 0, 0);
            opponent.position.set(2, 0, 0);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isJumpingP1) {
                player.position.y += p1VelocityY;
                p1VelocityY -= gravity;
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    isJumpingP1 = false;
                    p1VelocityY = 0;
                }
            }

            aiLogic();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
