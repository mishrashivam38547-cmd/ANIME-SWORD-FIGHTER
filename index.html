<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Sword Fighter</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #131c2e;
            border: 1px solid #1f2d4a;
            border-radius: 16px;
            padding: 24px;
            width: 350px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .fighters-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .fighter-card {
            background-color: #1a2744;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .fighter-card.selected {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        .fighter-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 0 auto 8px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 24px;
        }
        #kaze-avatar { background: radial-gradient(circle, #38bdf8, #1d4ed8); }
        #raiden-avatar { background: radial-gradient(circle, #f43f5e, #be123c); }
        #yami-avatar { background: radial-gradient(circle, #a855f7, #6b21a8); }
        
        .fighter-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .fighter-desc {
            font-size: 11px;
            color: #94a3b8;
        }
        .start-btn {
            background: linear-gradient(135deg, #f43f5e, #fb7185);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .hidden {
            display: none !important;
        }
        .battle-arena {
            text-align: center;
        }
        .arena-title {
            color: #38bdf8;
            font-size: 16px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .health-container {
            margin-bottom: 15px;
            text-align: left;
            font-size: 12px;
        }
        .health-bar-bg {
            background-color: #1a2744;
            border-radius: 4px;
            height: 10px;
            width: 100%;
            margin-top: 4px;
            overflow: hidden;
        }
        .health-bar {
            height: 100%;
            width: 100%;
            background-color: #22c55e;
            transition: width 0.3s ease;
        }
        .action-btns {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }
        .action-btn {
            flex: 1;
            background-color: #38bdf8;
            color: #0b0f19;
            border: none;
            border-radius: 6px;
            padding: 10px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }
        .action-btn:active {
            opacity: 0.8;
        }
        .battle-log {
            background-color: #0b0f19;
            border: 1px solid #1f2d4a;
            border-radius: 6px;
            padding: 8px;
            font-size: 11px;
            color: #94a3b8;
            height: 50px;
            overflow-y: auto;
            margin-top: 10px;
            text-align: left;
        }
        .back-btn {
            background-color: #334155;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            margin-top: 12px;
            cursor: pointer;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Selection Screen -->
        <div id="selection-screen">
            <h1>⚔️ ANIME SWORD FIGHTER</h1>
            <div class="subtitle">VERSION 2 • CHOOSE YOUR WARRIOR</div>

            <div class="fighters-grid">
                <div class="fighter-card selected" onclick="selectFighter('kaze', this)">
                    <div class="fighter-avatar" id="kaze-avatar">⚡</div>
                    <div class="fighter-name">KAZE</div>
                    <div class="fighter-desc">Balanced • Wind Slash</div>
                </div>

                <div class="fighter-card" onclick="selectFighter('raiden', this)">
                    <div class="fighter-avatar" id="raiden-avatar">⚡</div>
                    <div class="fighter-name">RAIDEN</div>
                    <div class="fighter-desc">Fast • Lightning</div>
                </div>

                <div class="fighter-card" onclick="selectFighter('yami', this)">
                    <div class="fighter-avatar" id="yami-avatar">🌑</div>
                    <div class="fighter-name">YAMI</div>
                    <div class="fighter-desc">Heavy • Dark Strike</div>
                </div>
            </div>

            <button class="start-btn" onclick="startBattle()">START BATTLE</button>
        </div>

        <!-- Battle Screen -->
        <div id="battle-screen" class="battle-arena hidden">
            <div class="arena-title">🔥 BATTLE ARENA 🔥</div>
            
            <div class="health-container">
                <div>Enemy HP: <span id="enemy-hp-text">100</span>%</div>
                <div class="health-bar-bg"><div id="enemy-health" class="health-bar"></div></div>
            </div>

            <div style="font-size: 32px; margin: 10px 0;" id="fighter-icon">⚡</div>
            <div style="font-size: 13px; font-weight: bold;" id="chosen-fighter-name"></div>

            <div class="health-container" style="margin-top: 10px;">
                <div>Your HP: <span id="player-hp-text">100</span>%</div>
                <div class="health-bar-bg"><div id="player-health" class="health-bar" style="background-color: #38bdf8;"></div></div>
            </div>

            <div class="action-btns">
                <button class="action-btn" onclick="playerAttack()">ATTACK</button>
                <button class="action-btn" style="background-color: #f43f5e; color: white;" onclick="specialMove()">SPECIAL</button>
            </div>

            <div id="battle-log" class="battle-log">Battle started! Choose your move.</div>

            <button class="back-btn" onclick="goBack()">CHOOSE AGAIN</button>
        </div>
    </div>

    <script>
        let selectedFighter = 'kaze';
        let playerHp = 100;
        let enemyHp = 100;

        function selectFighter(fighter, element) {
            document.querySelectorAll('.fighter-card').forEach(card => {
                card.classList.remove('selected');
            });
            element.classList.add('selected');
            selectedFighter = fighter;
        }

        function startBattle() {
            document.getElementById('selection-screen').classList.add('hidden');
            document.getElementById('battle-screen').classList.remove('hidden');
            
            document.getElementById('chosen-fighter-name').innerText = selectedFighter.toUpperCase();
            let icon = '⚡';
            if(selectedFighter === 'yami') icon = '🌑';
            document.getElementById('fighter-icon').innerText = icon;

            playerHp = 100;
            enemyHp = 100;
            updateHealth();
            logMessage("Match started against Shadow Shadow!");
        }

        function playerAttack() {
            if(playerHp <= 0 || enemyHp <= 0) return;
            
            let damageToEnemy = Math.floor(Math.random() * 15) + 10;
            enemyHp = Math.max(0, enemyHp - damageToEnemy);
            logMessage("Aapne " + damageToEnemy + " damage diya!");

            checkWin();
            if(enemyHp > 0) {
                setTimeout(enemyTurn, 600);
            }
            updateHealth();
        }

        function specialMove() {
            if(playerHp <= 0 || enemyHp <= 0) return;

            let damageToEnemy = Math.floor(Math.random() * 25) + 15;
            enemyHp = Math.max(0, enemyHp - damageToEnemy);
            logMessage("Special Move! " + damageToEnemy + " heavy damage diya!");

            checkWin();
            if(enemyHp > 0) {
                setTimeout(enemyTurn, 600);
            }
            updateHealth();
        }

        function enemyTurn() {
            let damageToPlayer = Math.floor(Math.random() * 12) + 8;
            playerHp = Math.max(0, playerHp - damageToPlayer);
            logMessage("Enemy ne aapko " + damageToPlayer + " damage diya!");
            
            checkWin();
            updateHealth();
        }

        function updateHealth() {
            document.getElementById('player-health').style.width = playerHp + '%';
            document.getElementById('player-hp-text').innerText = playerHp;
            document.getElementById('enemy-health').style.width = enemyHp + '%';
            document.getElementById('enemy-hp-text').innerText = enemyHp;
        }

        function logMessage(msg) {
            document.getElementById('battle-log').innerText = msg;
        }

        function checkWin() {
            if(enemyHp === 0) {
                logMessage("🎉 Aapne match jeet liya!");
            } else if(playerHp === 0) {
                logMessage("💥 Aap haar gaye! Phir se koshish karein.");
            }
        }

        function goBack() {
            document.getElementById('battle-screen').classList.add('hidden');
            document.getElementById('selection-screen').classList.remove('hidden');
        }
    </script>

</body>
</html>
