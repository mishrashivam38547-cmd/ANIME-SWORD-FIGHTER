<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Sword Fighting Game - Fixed Camera</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background: #050508;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: space-between;
            width: 92%;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .health-container {
            width: 38%;
            background: rgba(30, 30, 35, 0.8);
            border: 2px solid #555;
            height: 22px;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .health-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            transition: width 0.15s ease-out;
        }
        #p2-health { background: linear-gradient(90deg, #2193b0, #6dd5ed); }
        #level-info {
            position: absolute;
            top: 48px;
            width: 100%;
            text-align: center;
            color: #f39c12;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }
        #controls {
            position: absolute;
            bottom: 15px;
            width: 100%;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 10;
            padding: 0 10px;
        }
        button {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
        }
        button:active {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0.95);
        }
        .skill-btn { border-color: #f39c12; color: #f39c12; }
    </style>
</head>
<body>

    <div id="ui">
        <div>P1: <span id="p1-name">Swordsman</span></div>
        <div class="health-container"><div id="p1-health" class="health-bar"></div></div>
        <div class="health-container"><div id="p2-health" class="health-bar"></div></div>
        <div>AI: <span id="p2-name">Shadow Blade</span></div>
    </div>
    
    <div id="level-info">STAGE <span id="current-level">1</span> / 300</div>

    <div id="controls">
        <button onclick="movePlayer('left')">⬅️</button>
        <button onclick="movePlayer('right')">➡️</button>
        <button onclick="movePlayer('jump')">⬆️ Jump</button>
        <button onclick="playerAttack('slash')" style="background: rgba(231, 76, 60, 0.3);">⚔️ Slash</button>
        <button onclick="playerAttack('heavy')" style="background: rgba(192, 57, 43, 0.4);">🗡️ Heavy</button>
        <button class="skill-btn" onclick="playerSkill('energy')">✨ Energy Slash</button>
        <button class="skill-btn" onclick="playerSkill('spin')">🌀 Spin Blade</button>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let player, opponent;
        let p1Health = 100, p2Health = 100;
        let p1VelocityY = 0;
        let isJumpingP1 = false;
        const gravity = 0.018;
        
        let currentLevel = 1;
        const maxLevel = 300;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050811);
            scene.fog = new THREE.FogExp2(0x050811, 0.03);

            // Fixed Side-Scroller Camera View (Proper Framing)
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 14);
            camera.lookAt(0, 1, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Arena Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(0, 10, 5);
            scene.add(dirLight);

            // Floor
            const floorGeo = new THREE.PlaneGeometry(30, 15);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x11161d, roughness: 0.5 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Fighters Creation
            player = createSwordFighter(0xe74c3c, 0x3498db);
            player.position.set(-3, 0, 0);
            scene.add(player);

            opponent = createSwordFighter(0x9b59b6, 0xe67e22);
            opponent.position.set(3, 0, 0);
            // Face each other properly
            player.rotation.y = Math.PI / 2;
            opponent.rotation.y = -Math.PI / 2;

            scene.add(opponent);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createSwordFighter(suitColor, swordColor) {
            const group = new THREE.Group();
            const suitMat = new THREE.MeshStandardMaterial({ color: suitColor, roughness: 0.4 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xe0ac69, roughness: 0.6 });
            const jointMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.8 });
            const bladeMat = new THREE.MeshStandardMaterial({ color: 0xecf0f1, metalness: 0.9, roughness: 0.1 });
            const hiltMat = new THREE.MeshStandardMaterial({ color: swordColor, roughness: 0.3 });

            // Torso
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.0, 0.3), suitMat);
            torso.position.y = 1.1;
            group.add(torso);
            group.userData.torso = torso;

            // Head
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), skinMat);
            head.position.y = 1.8;
            group.add(head);

            // Arms & Sword Container
            const armGroup = new THREE.Group();
            armGroup.position.set(0, 1.4, 0);
            
            const arm = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.7, 0.15), jointMat);
            arm.position.set(0, -0.2, 0.2);
            armGroup.add(arm);

            // Sword
            const swordGroup = new THREE.Group();
            swordGroup.position.set(0, -0.5, 0.4);
            
            const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.08), hiltMat);
            swordGroup.add(hilt);

            const blade = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.2, 0.02), bladeMat);
            blade.position.y = 0.7;
            swordGroup.add(blade);

            armGroup.add(swordGroup);
            group.add(armGroup);
            group.userData.armGroup = armGroup;

            // Legs
            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.9, 0.2), jointMat);
            leftLeg.position.set(0, 0.45, -0.1);
            group.add(leftLeg);

            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.9, 0.2), jointMat);
            rightLeg.position.set(0, 0.45, 0.1);
            group.add(rightLeg);

            return group;
        }

        function movePlayer(action) {
            if (action === 'left') {
                player.position.x = Math.max(-5.5, player.position.x - 0.4);
                player.rotation.y = -Math.PI / 2;
            }
            if (action === 'right') {
                player.position.x = Math.min(5.5, player.position.x + 0.4);
                player.rotation.y = Math.PI / 2;
            }
            if (action === 'jump' && !isJumpingP1) {
                p1VelocityY = 0.35;
                isJumpingP1 = true;
            }
        }

        function playerAttack(type) {
            let damage = type === 'slash' ? 10 : 18;

            // Attack Slash Animation
            player.userData.armGroup.rotation.x = -1.2;
            setTimeout(() => {
                player.userData.armGroup.rotation.x = 0;
            }, 150);

            let dist = Math.abs(player.position.x - opponent.position.x);
            if (dist < 2.5) {
                p2Health = Math.max(0, p2Health - damage);
                document.getElementById('p2-health').style.width = p2Health + '%';
                
                // Knockback inside screen limits
                opponent.position.x = Math.min(5.5, opponent.position.x + 0.6);
                checkWin();
            }
        }

        function playerSkill(skillType) {
            if (skillType === 'energy') {
                let damage = 25;
                p2Health = Math.max(0, p2Health - damage);
                document.getElementById('p2-health').style.width = p2Health + '%';
                opponent.position.x = Math.min(5.5, opponent.position.x + 1.0);
                checkWin();
            } else if (skillType === 'spin') {
                let damage = 30;
                p2Health = Math.max(0, p2Health - damage);
                document.getElementById('p2-health').style.width = p2Health + '%';
                opponent.position.x = Math.min(5.5, opponent.position.x + 1.2);
                checkWin();
            }
        }

        function aiLogic() {
            let currentAiSpeed = 0.03 + Math.min(currentLevel * 0.0004, 0.04);
            let currentAiChance = 0.02 + Math.min(currentLevel * 0.00025, 0.03);

            // Keep AI facing player
            if (player.position.x > opponent.position.x) {
                opponent.rotation.y = Math.PI / 2;
            } else {
                opponent.rotation.y = -Math.PI / 2;
            }

            // AI movement towards player within boundaries (-5.5 to 5.5)
            if (Math.abs(player.position.x - opponent.position.x) > 1.5) {
                let dir = player.position.x > opponent.position.x ? currentAiSpeed : -currentAiSpeed;
                opponent.position.x = Math.max(-5.5, Math.min(5.5, opponent.position.x + dir));
            }

            let dist = Math.abs(player.position.x - opponent.position.x);
            if (dist < 2.2 && Math.random() < currentAiChance) {
                opponent.userData.armGroup.rotation.x = -1.2;
                setTimeout(() => { opponent.userData.armGroup.rotation.x = 0; }, 150);

                let aiDamage = 8 + Math.floor(currentLevel * 0.04);
                p1Health = Math.max(0, p1Health - aiDamage);
                document.getElementById('p1-health').style.width = p1Health + '%';

                player.position.x = Math.max(-5.5, player.position.x - 0.5);
                checkWin();
            }
        }

        function checkWin() {
            if (p1Health <= 0) {
                alert("Defeat! Restarting Stage " + currentLevel);
                resetMatch();
            } else if (p2Health <= 0) {
                if (currentLevel >= maxLevel) {
                    alert("Legendary Champion! You completed all 300 Stages!");
                    currentLevel = 1;
                } else {
                    alert("Stage " + currentLevel + " Cleared! Moving to Stage " + (currentLevel + 1));
                    currentLevel++;
                }
                document.getElementById('current-level').innerText = currentLevel;
                resetMatch();
            }
        }

        function resetMatch() {
            p1Health = 100;
            p2Health = 100;
            document.getElementById('p1-health').style.width = '100%';
            document.getElementById('p2-health').style.width = '100%';
            player.position.set(-3, 0, 0);
            opponent.position.set(3, 0, 0);
            player.rotation.y = Math.PI / 2;
            opponent.rotation.y = -Math.PI / 2;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isJumpingP1) {
                player.position.y += p1VelocityY;
                p1VelocityY -= gravity;
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    isJumpingP1 = false;
                    p1VelocityY = 0;
                }
            }

            aiLogic();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
