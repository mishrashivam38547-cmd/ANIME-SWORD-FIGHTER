<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Fighting Game</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
            user-select: none;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: space-between;
            width: 95%;
            color: white;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
        }
        .health-container {
            width: 35%;
            background: #444;
            border: 2px solid #fff;
            height: 20px;
            border-radius: 4px;
            overflow: hidden;
        }
        .health-bar {
            height: 100%;
            width: 100%;
            background: #e74c3c;
            transition: width 0.2s ease;
        }
        #p2-health {
            background: #3498db;
        }
        #instructions {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            color: #aaa;
            font-size: 12px;
            z-index: 10;
        }
        #controls {
            position: absolute;
            bottom: 15px;
            width: 100%;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 10;
            padding: 0 10px;
        }
        button {
            padding: 12px 18px;
            font-size: 14px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        button:active {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>P1: <span id="p1-name">Fighter</span></div>
        <div class="health-container"><div id="p1-health" class="health-bar"></div></div>
        <div class="health-container"><div id="p2-health" class="health-bar"></div></div>
        <div>AI: <span id="p2-name">Shadow</span></div>
    </div>
    
    <div id="instructions">A/D: Move | W: Jump | J: Punch | K: Kick</div>

    <div id="controls">
        <button onclick="movePlayer('left')">⬅️ Left</button>
        <button onclick="movePlayer('right')">Right ➡️</button>
        <button onclick="movePlayer('jump')">⬆️ Jump</button>
        <button onclick="playerAttack('punch')" style="background: rgba(231, 76, 60, 0.4);">Punch</button>
        <button onclick="playerAttack('kick')" style="background: rgba(52, 152, 219, 0.4);">Kick</button>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let player, opponent;
        let p1Health = 100, p2Health = 100;
        let p1VelocityY = 0;
        let isJumpingP1 = false;
        const gravity = 0.015;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);
            scene.fog = new THREE.Fog(0x0b0f19, 10, 50);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            const floorGeo = new THREE.PlaneGeometry(30, 15);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e272e, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const wallGeo = new THREE.BoxGeometry(30, 10, 0.5);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x11161d });
            const backWall = new THREE.Mesh(wallGeo, wallMat);
            backWall.position.set(0, 5, -7.5);
            scene.add(backWall);

            const p1Mat = new THREE.MeshStandardMaterial({ color: 0xe74c3c });
            player = createFighter(p1Mat);
            player.position.set(-2, 0, 0);
            scene.add(player);

            const p2Mat = new THREE.MeshStandardMaterial({ color: 0x3498db });
            opponent = createFighter(p2Mat);
            opponent.position.set(2, 0, 0);
            scene.add(opponent);

            window.addEventListener('keydown', (e) => {
                if (e.key === 'd' || e.key === 'D') player.position.x += 0.4;
                if (e.key === 'a' || e.key === 'A') player.position.x -= 0.4;
                if ((e.key === 'w' || e.key === 'W') && !isJumpingP1) {
                    p1VelocityY = 0.3;
                    isJumpingP1 = true;
                }
                if (e.key === 'j' || e.key === 'J') playerAttack('punch');
                if (e.key === 'k' || e.key === 'K') playerAttack('kick');
            });

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createFighter(material) {
            const group = new THREE.Group();
            const torsoGeo = new THREE.BoxGeometry(0.8, 1.2, 0.4);
            const torso = new THREE.Mesh(torsoGeo, material);
            torso.position.y = 1.2;
            group.add(torso);

            const headGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const head = new THREE.Mesh(headGeo, new THREE.MeshStandardMaterial({ color: 0xffdbac }));
            head.position.y = 2.0;
            group.add(head);

            return group;
        }

        function movePlayer(action) {
            if (action === 'left') player.position.x -= 0.5;
            if (action === 'right') player.position.x += 0.5;
            if (action === 'jump' && !isJumpingP1) {
                p1VelocityY = 0.3;
                isJumpingP1 = true;
            }
        }

        function playerAttack(type) {
            let damage = type === 'punch' ? 5 : 10;
            let dist = Math.abs(player.position.x - opponent.position.x);
            if (dist < 2.0) {
                p2Health = Math.max(0, p2Health - damage);
                document.getElementById('p2-health').style.width = p2Health + '%';
                opponent.position.x += 0.3;
                setTimeout(() => opponent.position.x -= 0.3, 100);
                checkWin();
            }
        }

        function aiLogic() {
            if (Math.random() < 0.03) {
                let dir = player.position.x > opponent.position.x ? 0.05 : -0.05;
                opponent.position.x += dir;
            }
            let dist = Math.abs(player.position.x - opponent.position.x);
            if (dist < 1.8 && Math.random() < 0.02) {
                p1Health = Math.max(0, p1Health - 5);
                document.getElementById('p1-health').style.width = p1Health + '%';
                player.position.x -= 0.3;
                setTimeout(() => player.position.x += 0.3, 100);
                checkWin();
            }
        }

        function checkWin() {
            if (p1Health <= 0) {
                alert("Opponent Wins! Game Over.");
                resetGame();
            } else if (p2Health <= 0) {
                alert("Player Wins! Victory!");
                resetGame();
            }
        }

        function resetGame() {
            p1Health = 100;
            p2Health = 100;
            document.getElementById('p1-health').style.width = '100%';
            document.getElementById('p2-health').style.width = '100%';
            player.position.set(-2, 0, 0);
            opponent.position.set(2, 0, 0);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isJumpingP1) {
                player.position.y += p1VelocityY;
                p1VelocityY -= gravity;
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    isJumpingP1 = false;
                    p1VelocityY = 0;
                }
            }

            aiLogic();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
