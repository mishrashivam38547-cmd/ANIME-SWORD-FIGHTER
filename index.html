<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Sword Fighter</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background-color: #131c2e;
            border: 1px solid #1f2d4a;
            border-radius: 16px;
            padding: 24px;
            width: 350px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            position: relative;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .fighters-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .fighter-card {
            background-color: #1a2744;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .fighter-card.selected {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        .fighter-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin: 0 auto 6px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
        }
        #kaze-avatar { background: radial-gradient(circle, #38bdf8, #1d4ed8); }
        #raiden-avatar { background: radial-gradient(circle, #f43f5e, #be123c); }
        #yami-avatar { background: radial-gradient(circle, #a855f7, #6b21a8); }
        
        .fighter-name {
            font-weight: bold;
            font-size: 13px;
        }
        .fighter-desc {
            font-size: 10px;
            color: #94a3b8;
        }
        .start-btn {
            background: linear-gradient(135deg, #f43f5e, #fb7185);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            width: 100%;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .hidden {
            display: none !important;
        }
        .battle-arena {
            text-align: center;
        }
        .arena-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #38bdf8;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .health-container {
            margin-bottom: 10px;
            text-align: left;
            font-size: 11px;
        }
        .health-bar-bg {
            background-color: #1a2744;
            border-radius: 4px;
            height: 8px;
            width: 100%;
            margin-top: 3px;
            overflow: hidden;
        }
        .health-bar {
            height: 100%;
            width: 100%;
            background-color: #22c55e;
            transition: width 0.3s ease;
        }
        .fighter-icon-container {
            font-size: 38px;
            margin: 8px 0;
            transition: transform 0.1s ease;
        }
        /* Hit animation */
        @keyframes shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 0); }
            40% { transform: translate(8px, 0); }
            60% { transform: translate(-6px, 0); }
            80% { transform: translate(6px, 0); }
            100% { transform: translate(0, 0); }
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }
        .action-btns {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }
        .action-btn {
            flex: 1;
            background-color: #38bdf8;
            color: #0b0f19;
            border: none;
            border-radius: 6px;
            padding: 9px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }
        .action-btn:active {
            opacity: 0.8;
        }
        .battle-log {
            background-color: #0b0f19;
            border: 1px solid #1f2d4a;
            border-radius: 6px;
            padding: 6px;
            font-size: 10px;
            color: #94a3b8;
            height: 40px;
            overflow-y: auto;
            margin-top: 8px;
            text-align: left;
        }
        .back-btn {
            background-color: #334155;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Selection Screen -->
        <div id="selection-screen">
            <h1>⚔️ ANIME SWORD FIGHTER</h1>
            <div class="subtitle">VERSION 2.1 • CHOOSE YOUR WARRIOR</div>

            <div class="fighters-grid">
                <div class="fighter-card selected" onclick="selectFighter('kaze', this)">
                    <div class="fighter-avatar" id="kaze-avatar">⚡</div>
                    <div class="fighter-name">KAZE</div>
                    <div class="fighter-desc">Balanced • Wind Slash</div>
                </div>

                <div class="fighter-card" onclick="selectFighter('raiden', this)">
                    <div class="fighter-avatar" id="raiden-avatar">⚡</div>
                    <div class="fighter-name">RAIDEN</div>
                    <div class="fighter-desc">Fast • Lightning</div>
                </div>

                <div class="fighter-card" onclick="selectFighter('yami', this)">
                    <div class="fighter-avatar" id="yami-avatar">🌑</div>
                    <div class="fighter-name">YAMI</div>
                    <div class="fighter-desc">Heavy • Dark Strike</div>
                </div>
            </div>

            <button class="start-btn" onclick="startBattle()">START BATTLE</button>
        </div>

        <!-- Battle Screen -->
        <div id="battle-screen" class="battle-arena hidden">
            <div class="arena-info">
                <span>STAGE <span id="stage-num">1</span>/3</span>
                <span id="enemy-title" style="color: #f43f5e;">Enemy: Goblin Thief</span>
            </div>
            
            <div class="health-container">
                <div>Enemy HP: <span id="enemy-hp-text">100</span>%</div>
                <div class="health-bar-bg"><div id="enemy-health" class="health-bar"></div></div>
            </div>

            <div class="fighter-icon-container" id="fighter-icon">⚡</div>
            <div style="font-size: 12px; font-weight: bold;" id="chosen-fighter-name"></div>

            <div class="health-container" style="margin-top: 8px;">
                <div>Your HP: <span id="player-hp-text">100</span>%</div>
                <div class="health-bar-bg"><div id="player-health" class="health-bar" style="background-color: #38bdf8;"></div></div>
            </div>

            <div class="action-btns">
                <button class="action-btn" onclick="playerAttack()">ATTACK</button>
                <button class="action-btn" style="background-color: #f43f5e; color: white;" onclick="specialMove()">SPECIAL</button>
            </div>

            <div id="battle-log" class="battle-log">Match shuru ho chuka hai! Apna move chunein.</div>

            <button class="back-btn" onclick="goBack()">MENU</button>
        </div>
    </div>

    <script>
        let selectedFighter = 'kaze';
        let playerHp = 100;
        let enemyHp = 100;
        let currentStage = 1;

        const enemies = [
            { name: "Goblin Thief", hp: 100, dmg: 10 },
            { name: "Shadow Samurai", hp: 130, dmg: 15 },
            { name: "Demon Lord", hp: 160, dmg: 20 }
        ];

        // Web Audio API for Sound Effects without external files
        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'special') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                }
            } catch (e) {
                // Audio context policy fix for mobile browsers
            }
        }

        function selectFighter(fighter, element) {
            document.querySelectorAll('.fighter-card').forEach(card => {
                card.classList.remove('selected');
            });
            element.classList.add('selected');
            selectedFighter = fighter;
        }

        function startBattle() {
            currentStage = 1;
            playerHp = 100;
            loadStage();
            
            document.getElementById('selection-screen').classList.add('hidden');
            document.getElementById('battle-screen').classList.remove('hidden');
            
            document.getElementById('chosen-fighter-name').innerText = selectedFighter.toUpperCase();
            let icon = '⚡';
            if(selectedFighter === 'yami') icon = '🌑';
            document.getElementById('fighter-icon').innerText = icon;
            
            logMessage("Stage 1 shuru! " + enemies[0].name + " se mukabla hai.");
        }

        function loadStage() {
            let currentEnemy = enemies[currentStage - 1];
            enemyHp = currentEnemy.hp;
            document.getElementById('stage-num').innerText = currentStage;
            document.getElementById('enemy-title').innerText = "Enemy: " + currentEnemy.name;
            updateHealth();
        }

        function triggerAnimation(elementId) {
            let el = document.getElementById(elementId);
            el.classList.add('shake');
            setTimeout(() => {
                el.classList.remove('shake');
            }, 300);
        }

        function playerAttack() {
            if(playerHp <= 0 || enemyHp <= 0) return;
            
            playSound('hit');
            triggerAnimation('fighter-icon');

            let damageToEnemy = Math.floor(Math.random() * 15) + 12;
            enemyHp = Math.max(0, enemyHp - damageToEnemy);
            logMessage("Aapne " + damageToEnemy + " damage diya!");

            updateHealth();
            checkStageWin();

            if(enemyHp > 0) {
                setTimeout(enemyTurn, 600);
            }
        }

        function specialMove() {
            if(playerHp <= 0 || enemyHp <= 0) return;

            playSound('special');
            triggerAnimation('fighter-icon');

            let damageToEnemy = Math.floor(Math.random() * 25) + 20;
            enemyHp = Math.max(0, enemyHp - damageToEnemy);
            logMessage("⚡ Special Move! " + damageToEnemy + " heavy damage!");

            updateHealth();
            checkStageWin();

            if(enemyHp > 0) {
                setTimeout(enemyTurn, 600);
            }
        }

        function enemyTurn() {
            let currentEnemy = enemies[currentStage - 1];
            let damageToPlayer = Math.floor(Math.random() * currentEnemy.dmg) + 5;
            playerHp = Math.max(0, playerHp - damageToPlayer);
            
            logMessage(currentEnemy.name + " ne aapko " + damageToPlayer + " damage diya!");
            updateHealth();

            if(playerHp <= 0) {
                logMessage("💥 Aap haar gaye! Phir se koshish karein.");
            }
        }

        function updateHealth() {
            let maxEnemyHp = enemies[currentStage - 1].hp;
            let enemyPercent = (enemyHp / maxEnemyHp) * 100;
            
            document.getElementById('player-health').style.width = playerHp + '%';
            document.getElementById('player-hp-text').innerText = playerHp;
            document.getElementById('enemy-health').style.width = enemyPercent + '%';
            document.getElementById('enemy-hp-text').innerText = Math.round(enemyPercent);
        }

        function logMessage(msg) {
            document.getElementById('battle-log').innerText = msg;
        }

        function checkStageWin() {
            if(enemyHp <= 0) {
                playSound('win');
                if(currentStage < 3) {
                    currentStage++;
                    logMessage("🎉 Stage clear! Agla stage shuru ho raha hai...");
                    setTimeout(() => {
                        loadStage();
                        logMessage("Stage " + currentStage + " shuru! Naya dushman aa gaya.");
                    }, 1500);
                } else {
                    logMessage("🏆 Badhai ho! Aapne saare stages jeet liye hain!");
                }
            }
        }

        function goBack() {
            document.getElementById('battle-screen').classList.add('hidden');
            document.getElementById('selection-screen').classList.remove('hidden');
        }
    </script>

</body>
</html>
